[project]
name = "agricredit-agent"
version = "0.1.0"
description = "AgriCredit Agent: evidence-first agricultural input and credit risk advisory for local extension offices and cooperatives."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "AgriCredit Agent contributors" }]
# Direct dependencies, pinned to the versions tested. requirements.lock pins the full transitive set.
dependencies = [
    "mcp==2.3.0",
    "langgraph==1.2.14",
    "pydantic==2.13.5",
    "scikit-learn==1.9.1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "joblib==1.6.0",
    "streamlit==1.65.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
agricredit = "agricredit.cli.main:main"
agricredit-mcp = "agricredit.mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
